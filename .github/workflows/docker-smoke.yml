name: docker-smoke

# Builds the existing Dockerfile and runs the keyless MCP handshake smoke test
# (initialize + tools/list with no API key). This is the same check Glama/Smithery
# run against the published image, so we keep it green on every change.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run keyless handshake smoke test
        run: ./docker-smoke.sh
