name: ci

# Runs the package test suite, which includes the OPS-02 version-sync guard
# (scripts/check-versions.mjs): CI fails if the version disagrees across
# package.json, manifest.json, server.json or the committed .mcpb bundle.

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - name: Version-sync guard (knowfirm.com#209)
        run: npm run check-versions
      - name: Test with coverage (100% lines/branches/functions/statements enforced via .c8rc.json)
        run: npm run coverage
